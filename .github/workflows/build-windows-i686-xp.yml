name: Build Windows i686 (XP Compatible)

on:
  push:
    branches: [master, main, dev]
  workflow_dispatch:
    inputs:
      stage:
        description: Which stage to run
        required: true
        default: build
        type: choice
        options:
          - validate
          - build
          - release

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: ${{ vars.CMAKE_BUILD_TYPE || 'RelWithDebInfo' }}

jobs:
  check:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse commit message
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          MANUAL_STAGE: ${{ github.event.inputs.stage || '' }}
        run: |
          MSG="$COMMIT_MSG"
          MANUAL="$MANUAL_STAGE"
          echo "commit_message=$MSG" >> "$GITHUB_OUTPUT"

          VERSION="v$(grep '^    VERSION' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9.]*\).*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"

          BUILD=false
          RELEASE=false

          if [ -n "$MANUAL" ]; then
            case "$MANUAL" in
              release) BUILD=true; RELEASE=true ;;
              build)   BUILD=true ;;
              validate) ;;
            esac
          elif echo "$MSG" | grep -qi "build release"; then
            BUILD=true
            RELEASE=true
          elif echo "$MSG" | grep -qi "build action"; then
            BUILD=true
          fi

          echo "should_build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "flags: build=$BUILD release=$RELEASE"

  build:
    name: Build i686 XP binary
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSYS2 (MINGW32 / i686)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-ninja
            mingw-w64-i686-7zip
            mingw-w64-i686-pkg-config
            mingw-w64-i686-zlib

      - name: Print MSYS2 version
        run: uname -a

      - name: Print compiler version
        run: gcc --version

      - name: Configure project (XP Compat)
        run: >
          cmake
          -G Ninja
          -DCMAKE_SYSTEM_PROCESSOR_OVERRIDE=i686
          -DSET_TWEAK=Off
          -DBUILD_TESTS=Off
          -DENABLE_WINXP_COMPAT=ON
          -DENABLE_WIN81_COMPAT=OFF
          -DENABLE_VULKAN=OFF
          -DENABLE_OPENCL=OFF
          -DENABLE_DBUS=OFF
          -DENABLE_GIO=OFF
          -DENABLE_DCONF=OFF
          -DENABLE_SQLITE3=OFF
          -DENABLE_RPM=OFF
          -DENABLE_IMAGEMAGICK7=OFF
          -DENABLE_IMAGEMAGICK6=OFF
          -DENABLE_CHAFA=OFF
          -DENABLE_EGL=OFF
          -DENABLE_GLX=OFF
          -DENABLE_FREETYPE=OFF
          -DENABLE_PULSE=OFF
          -DENABLE_DDCUTIL=OFF
          -DENABLE_ELF=OFF
          -DENABLE_LIBZFS=OFF
          -DENABLE_WORDEXP=OFF
          .

      - name: Build project
        run: cmake --build . --verbose -j4

      - name: Copy essential DLLs
        run: |
          cp /mingw32/bin/libgcc_s_dw2-1.dll . 2>/dev/null || true
          cp /mingw32/bin/libwinpthread-1.dll . 2>/dev/null || true
          cp /mingw32/bin/libstdc++-6.dll . 2>/dev/null || true

      - name: List features
        run: |
          ./fastfetch --list-features 2>&1 || echo "fastfetch --list-features failed"

      - name: Run fastfetch
        run: |
          time ./fastfetch -c presets/ci.jsonc --stat false 2>&1 || echo "fastfetch run failed (expected on CI without GPU, etc.)"

      - name: Run flashfetch
        run: |
          time ./flashfetch 2>&1 || echo "flashfetch run failed"

      - name: Print dependencies
        run: |
          objdump -p fastfetch.exe | grep "DLL Name" || echo "objdump not available"

      - name: Create ZIP archive
        run: |
          7z a -tzip -mx9 -bd -y fastfetch-windows-i686-xp.zip LICENSE fastfetch.exe flashfetch.exe *.dll presets 2>/dev/null || 7z a -tzip -mx9 -bd -y fastfetch-windows-i686-xp.zip LICENSE fastfetch.exe flashfetch.exe presets

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastfetch-windows-i686-xp
          path: ./fastfetch-windows-i686-xp.zip
          overwrite: true
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: fastfetch-windows-i686-xp
          path: dist/

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          REPO="${{ github.repository }}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          COMMIT_SHA="${GITHUB_SHA::7}"

          cat > release_notes.md << 'NOTES_EOF'
          ## fastfetch for Windows XP (i686)

          Cross-compiled for **Windows XP SP3 (i686)** using MSYS2 MINGW32 + GCC with the `ENABLE_WINXP_COMPAT` flag.

          > This is an **experimental** build — some detection features (GPU, disk I/O) rely on Vista+ kernel APIs and may fail gracefully on XP.

          ### Build Info

          | Item              | Value                                    |
          |-------------------|------------------------------------------|
          | Target            | `i686-windows-xp`                        |
          | Toolchain         | MSYS2 MINGW32 (GCC i686)                 |
          | Subsystem         | Windows 5.1 (XP)                         |
          | `_WIN32_WINNT`    | `0x0501`                                 |

          ### Included Files

          ```
          fastfetch.exe
          flashfetch.exe
          libgcc_s_dw2-1.dll
          libwinpthread-1.dll
          libstdc++-6.dll
          presets/
          LICENSE
          ```

          ### Usage

          Extract the ZIP and run:

          ```cmd
          fastfetch.exe
          ```

          ### Known Limitations on XP

          - GPU detection may not work (D3DKMT not available on XP)
          - Detection modules relying on `winbrand.dll` fall back to registry
          - Some I/O stats require Vista+ kernel APIs

          NOTES_EOF

          sed -i 's/^          //' release_notes.md

          cat >> release_notes.md << EOF
          ---

          Last successful build: **${BUILD_TIME}** · Commit [\`${COMMIT_SHA}\`](https://github.com/${REPO}/commit/${GITHUB_SHA})

          > *Generated by GitHub Actions CI workflow.*
          EOF

          sed -i 's/^          //' release_notes.md

          gh release delete "${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file release_notes.md \
            --prerelease \
            dist/*
